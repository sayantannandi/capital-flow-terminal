<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Capital Flow Terminal</title>
  <style>
    body {
      margin: 0;
      background: #071014;
      color: #e7eef2;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .terminal {
      text-align: center;
    }

    h1 {
      color: #5ce1a4;
      margin-bottom: 8px;
    }

    .status {
      color: #8fa5b2;
    }

    .online {
      color: #5ce1a4;
    }
  </style>
</head>
<body>
  <div class="terminal">
    <h1>GLOBAL CAPITAL FLOW TERMINAL</h1>
    <p>Global Macro + U.S. Equity Capital Rotation</p>
    <p class="status">
      SYSTEM STATUS:
      <span class="online">● ONLINE</span>
    </p>
    <p>Version 1.0 — Infrastructure Test</p>
  </div>
</body>
</html>
